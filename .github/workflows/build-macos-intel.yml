name: Build Intel macOS DMG

on:
  push:
    branches:
      - main
      - feature/macos-intel-zh-cn
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-intel:
    name: Intel Mac DMG (x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Verify Python source syntax
        run: python -m compileall -q run.py src

      - name: Generate native macOS application icon
        run: |
          mkdir -p icon.iconset
          for sz in 16 32 128 256 512; do
            sips -z "$sz" "$sz" assets/icon.png --out "icon.iconset/icon_${sz}x${sz}.png" >/dev/null
            dbl=$((sz * 2))
            sips -z "$dbl" "$dbl" assets/icon.png --out "icon.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o assets/instaloader.icns

      - name: Package x86_64 application
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --onedir \
            --target-architecture x86_64 \
            --name "Instaloader GUI Wrapper" \
            --osx-bundle-identifier "io.github.rok1n.instaloaderguiwrapper" \
            --icon assets/instaloader.icns \
            --add-data "assets:assets" \
            --collect-all qdarktheme \
            --collect-submodules instaloader \
            run.py

      - name: Verify x86_64 and create distributable DMG
        run: |
          set -euo pipefail
          APP="dist/Instaloader GUI Wrapper.app"
          test -d "$APP"
          BIN="$APP/Contents/MacOS/Instaloader GUI Wrapper"
          test -f "$BIN"
          file "$BIN"
          lipo "$BIN" -verify_arch x86_64
          # Re-sign locally only; Apple Developer ID signing/notarization needs
          # a separate credentialed release pipeline.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p dmg-root
          ditto "$APP" "dmg-root/Instaloader GUI Wrapper.app"
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "Instaloader GUI Wrapper" \
            -srcfolder dmg-root \
            -ov -format UDZO \
            "Instaloader-GUI-Wrapper-macOS-Intel-x86_64-zh-CN.dmg"
          shasum -a 256 Instaloader-GUI-Wrapper-macOS-Intel-x86_64-zh-CN.dmg \
            > Instaloader-GUI-Wrapper-macOS-Intel-x86_64-zh-CN.dmg.sha256

      - name: Upload DMG for testing
        uses: actions/upload-artifact@v4
        with:
          name: Instaloader-GUI-Wrapper-macOS-Intel-zh-CN
          path: |
            Instaloader-GUI-Wrapper-macOS-Intel-x86_64-zh-CN.dmg
            Instaloader-GUI-Wrapper-macOS-Intel-x86_64-zh-CN.dmg.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish macOS Intel release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.4.0-zh-macos-intel' }}
          name: Instaloader GUI Wrapper 1.4 简体中文 (Intel macOS)
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            简体中文界面和 Intel macOS 原生 DMG。
            适用于 Intel x86_64 Mac。此版本为未公证测试版（ad-hoc 签名）。
            安装：打开 DMG，拖拽 .app 到 Applications 文件夹。
            首次运行如被 macOS 阻止，请前往「系统设置 → 隐私与安全性」确认应用来源。
          files: |
            Instaloader-GUI-Wrapper-macOS-Intel-x86_64-zh-CN.dmg
            Instaloader-GUI-Wrapper-macOS-Intel-x86_64-zh-CN.dmg.sha256
